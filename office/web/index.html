<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Office</title>
<link rel="stylesheet" href="office.css">
</head>
<body>
<header id="bar">
  <strong>Office</strong>
  <span id="breadcrumb"><button id="home-link" class="crumb">Home</button></span>
  <span id="views"><button data-v="floor" class="on">Floor</button><button data-v="workflow">Workflow</button><button data-v="rooms">Rooms</button><button data-v="archive">Archive</button></span>
  <select id="op" title="Operation"></select>
  <span id="operation-error" class="note" hidden></span>
  <span id="coverage" class="cov" title="Coverage for this operation: events by provenance, and gaps between events.jsonl and the session transcript"></span>
  <span id="running-line" class="running-line"></span>
  <span class="sep"></span>
  <button id="play" title="Play / pause (space)">▶</button>
  <span id="speeds"><button data-s="1">1×</button><button data-s="10" class="on">10×</button><button data-s="100">100×</button></span>
  <label title="Collapse idle stretches over 30 s to 3 s"><input type="checkbox" id="compress" checked> skip idle</label>
  <span class="sep"></span>
  <button id="live" title="Follow new events as they arrive (server-sent events)">● Live</button>
  <label title="Hide actors with no activity in the last 10 minutes of the timeline"><input type="checkbox" id="focus" checked> focus</label>
  <span id="following" class="mono"></span>
  <span id="filterbar" class="mono"></span>
  <span id="clock" class="mono"></span>
  <span class="grow"></span>
  <span id="legend" class="mono"></span>
</header>
<div id="scrub"><canvas id="tl"></canvas></div>
<div id="workspace">
<main>
  <section id="floorwrap"><div id="running-now" hidden></div><canvas id="floor"></canvas><div id="tip"></div><div id="view" hidden></div></section>
  <aside id="inspector"><div class="empty">Click a node, an edge, a chip or an event.</div></aside>
</main>
</div>
<footer id="log"><div id="logbar"><label><input type="checkbox" id="raw"> raw events</label></div><div id="logrows"></div></footer>
<script type="module" src="office.js"></script>
</body>
</html>
